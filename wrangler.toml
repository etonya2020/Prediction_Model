# Ettylinks Matchday Prediction Model (Cloudflare Workers + static assets + D1)
# IMPORTANT: "name" must match the name of your Worker project in Cloudflare exactly.
name = "ettylinks-matchday"
main = "src/worker.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./public"

[[d1_databases]]
binding = "DB"
database_name = "ettylinks-matchday"
# Paste your D1 Database ID here (Cloudflare > Storage & databases > D1 > your database)
database_id = "PASTE-YOUR-D1-DATABASE-ID-HERE"
